services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # On every start, download the latest site/ folder from GitHub (main branch).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        wget -qO /tmp/site.tgz https://codeload.github.com/dev-perceptric/morning-telos/tar.gz/refs/heads/main;
        mkdir -p /tmp/src && tar -xzf /tmp/site.tgz -C /tmp/src;
        rm -rf /usr/share/nginx/html/* && cp -r /tmp/src/*/site/. /usr/share/nginx/html/;
        cp /tmp/src/*/deploy/nginx.conf /etc/nginx/conf.d/default.conf;
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    labels:
      - traefik.enable=true
      - traefik.http.routers.morningtelos.rule=Host(`morningtelos.com`) || Host(`www.morningtelos.com`)
      - traefik.http.routers.morningtelos.entrypoints=websecure
      - traefik.http.routers.morningtelos.tls.certresolver=letsencrypt
      - traefik.http.services.morningtelos.loadbalancer.server.port=80

  app:
    image: node:22-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://mt:${DB_PASSWORD}@db:5432/mt
      APP_SECRET: ${APP_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-meet@morningtelos.com}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-morningtelos-backups}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAN_PRICE_STARTER: ${PLAN_PRICE_STARTER:-}
      PLAN_PRICE_PRO: ${PLAN_PRICE_PRO:-}
    volumes:
      - /srv/morningtelos/backups:/backups
    # On every start, download the app from GitHub, install packages and run it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        wget -qO /tmp/src.tgz https://codeload.github.com/dev-perceptric/morning-telos/tar.gz/refs/heads/main;
        mkdir -p /srv && tar -xzf /tmp/src.tgz -C /srv;
        apk add --no-cache postgresql16-client >/dev/null 2>&1 || apk add --no-cache postgresql-client >/dev/null;
        cd /srv/*/app && npm ci --omit=dev --no-audit --no-fund;
        exec node server.js
    labels:
      - traefik.enable=true
      - traefik.http.routers.morningtelos-chat.rule=Host(`chat.morningtelos.com`)
      - traefik.http.routers.morningtelos-chat.entrypoints=websecure
      - traefik.http.routers.morningtelos-chat.tls.certresolver=letsencrypt
      - traefik.http.routers.morningtelos-chat.service=morningtelos-app
      - traefik.http.services.morningtelos-app.loadbalancer.server.port=3000
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mt
    # Stored on the server outside the project folder, so redeploys keep the data.
    volumes:
      - /srv/morningtelos/pgdata:/var/lib/postgresql/data
    # Keeps the stored password in sync with DB_PASSWORD on every start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo "ALTER USER mt PASSWORD '$$POSTGRES_PASSWORD';" | su-exec postgres postgres --single -D /var/lib/postgresql/data postgres >/dev/null; fi;
        exec docker-entrypoint.sh postgres
  # Emails the team if the app or the website stops answering, and again when it's back.
  watchdog:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app, web]
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-meet@morningtelos.com}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        apk add --no-cache curl >/dev/null;
        send() { [ -z "$$RESEND_API_KEY" ] && return; printf '{"from":"Morning Telos <meet@morningtelos.com>","to":["%s"],"subject":"[Morning Telos alert] %s","text":"%s. Checked from the server every minute."}' "$$ALERT_EMAIL" "$$1" "$$1" | curl -s -m 15 https://api.resend.com/emails -H "Authorization: Bearer $$RESEND_API_KEY" -H "Content-Type: application/json" --data-binary @- >/dev/null; };
        sleep 240; af=0; ad=0; wf=0; wd=0;
        while true; do
        if curl -fs -m 10 http://app:3000/healthz >/dev/null; then [ $$ad = 1 ] && send "The app is back up"; af=0; ad=0; else af=$$((af+1)); [ $$af -ge 3 ] && [ $$ad = 0 ] && { send "chat.morningtelos.com is down"; ad=1; }; fi;
        if curl -fs -m 10 -o /dev/null http://web/; then [ $$wd = 1 ] && send "The website is back up"; wf=0; wd=0; else wf=$$((wf+1)); [ $$wf -ge 3 ] && [ $$wd = 0 ] && { send "morningtelos.com is down"; wd=1; }; fi;
        sleep 60; done
