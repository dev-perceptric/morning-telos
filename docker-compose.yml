services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    configs:
      - source: index
        target: /usr/share/nginx/html/index.html
    labels:
      - traefik.enable=true
      - traefik.http.routers.morningtelos.rule=Host(`morningtelos.com`) || Host(`www.morningtelos.com`)
      - traefik.http.routers.morningtelos.entrypoints=websecure
      - traefik.http.routers.morningtelos.tls.certresolver=letsencrypt
      - traefik.http.services.morningtelos.loadbalancer.server.port=80

configs:
  index:
    content: |
      <!doctype html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Morning Telos</title>
      <meta name="description" content="Morning Telos builds AI automation for businesses.">
      <style>
        :root { --bg:#0b0b0d; --fg:#f4f1ea; --muted:#9a968d; --accent:#e8b65a; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html,body { height:100%; }
        body { background:var(--bg); color:var(--fg); font-family:Georgia,"Times New Roman",serif;
               display:flex; align-items:center; justify-content:center; padding:24px; }
        main { max-width:640px; text-align:center; }
        .mark { width:56px; height:56px; margin:0 auto 32px; border-radius:50%;
                background:radial-gradient(circle at 50% 60%, var(--accent) 0 38%, transparent 39%);
                box-shadow:0 0 60px rgba(232,182,90,.35); }
        h1 { font-size:clamp(40px,8vw,72px); font-weight:400; letter-spacing:.02em; }
        .greek { color:var(--muted); font-style:italic; margin-top:8px; font-size:15px; letter-spacing:.08em; }
        p.lead { margin-top:32px; font-size:clamp(18px,3vw,22px); line-height:1.5; }
        .soon { margin-top:40px; font-family:ui-monospace,Menlo,monospace; font-size:12px;
                letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }
      </style>
      </head>
      <body>
      <main>
        <div class="mark" aria-hidden="true"></div>
        <h1>Morning Telos</h1>
        <div class="greek">τέλος · purpose, the end it all works toward</div>
        <p class="lead">AI automation for businesses that want their time back.</p>
        <div class="soon">Launching soon</div>
      </main>
      </body>
      </html>
