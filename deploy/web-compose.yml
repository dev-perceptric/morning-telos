# The new Morning Telos app at new.morningtelos.com. A separate project from docker-compose.yml, so the old app keeps running.
# GitHub Actions builds the image (.github/workflows/build-images.yml). To update: docker compose -f deploy/web-compose.yml pull && docker compose -f deploy/web-compose.yml up -d
# Keys come from the server's environment, with the names in web/.env.example. Never put a value in this file.
services:
  web-new:
    image: ghcr.io/dev-perceptric/morningtelos-web:latest
    pull_policy: always
    restart: unless-stopped
    # Server-side calls to the database go straight to this VPS (Traefik), not out through public DNS.
    # A first lookup made before db.morningtelos.com existed stayed cached for an hour and broke the worker.
    extra_hosts:
      - "db.morningtelos.com:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARROWSTERR_PARTNER_URL: ${ARROWSTERR_PARTNER_URL:-}
      ARROWSTERR_PARTNER_KEY: ${ARROWSTERR_PARTNER_KEY:-}
      CAPYBAROAR_PARTNER_URL: ${CAPYBAROAR_PARTNER_URL:-}
      CAPYBAROAR_PARTNER_KEY: ${CAPYBAROAR_PARTNER_KEY:-}
      CAPYBAROAR_WEBHOOK_SECRET: ${CAPYBAROAR_WEBHOOK_SECRET:-}
      ARROWSTERR_MCP_URL: ${ARROWSTERR_MCP_URL:-}
      CAPYBAROAR_MCP_URL: ${CAPYBAROAR_MCP_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      APP_URL: ${APP_URL:-}
      SEALING_KEYS: ${SEALING_KEYS:-}
      SEALING_KEY_CURRENT: ${SEALING_KEY_CURRENT:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_BASE_URL: ${COMPOSIO_BASE_URL:-}
      COMPOSIO_AUTH_CONFIG_GMAIL: ${COMPOSIO_AUTH_CONFIG_GMAIL:-}
      COMPOSIO_AUTH_CONFIG_OUTLOOK: ${COMPOSIO_AUTH_CONFIG_OUTLOOK:-}
      COMPOSIO_AUTH_CONFIG_GOOGLECALENDAR: ${COMPOSIO_AUTH_CONFIG_GOOGLECALENDAR:-}
      COMPOSIO_AUTH_CONFIG_CALENDLY: ${COMPOSIO_AUTH_CONFIG_CALENDLY:-}
      COMPOSIO_AUTH_CONFIG_HUBSPOT: ${COMPOSIO_AUTH_CONFIG_HUBSPOT:-}
      COMPOSIO_AUTH_CONFIG_PIPEDRIVE: ${COMPOSIO_AUTH_CONFIG_PIPEDRIVE:-}
      COMPOSIO_AUTH_CONFIG_SALESFORCE: ${COMPOSIO_AUTH_CONFIG_SALESFORCE:-}
      COMPOSIO_AUTH_CONFIG_SLACK: ${COMPOSIO_AUTH_CONFIG_SLACK:-}
      COMPOSIO_AUTH_CONFIG_ZENDESK: ${COMPOSIO_AUTH_CONFIG_ZENDESK:-}
      COMPOSIO_AUTH_CONFIG_HELP_SCOUT: ${COMPOSIO_AUTH_CONFIG_HELP_SCOUT:-}
      # The browser copies of these are set at build time from repo variables. These are for server code.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.morningtelos-new.rule=Host(`new.morningtelos.com`)
      - traefik.http.routers.morningtelos-new.entrypoints=websecure
      - traefik.http.routers.morningtelos-new.tls.certresolver=letsencrypt
      - traefik.http.routers.morningtelos-new.service=morningtelos-web-new
      - traefik.http.services.morningtelos-web-new.loadbalancer.server.port=3000

  # Runs the job worker every minute (sign-up setup, key revokes, brand removal, the daily trial check).
  # It calls the app over the project's own network, so the worker URL is never public to the cron.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [web-new]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
        wget -q -T 280 -O /dev/null --header "Authorization: Bearer $$CRON_SECRET" --post-data "" http://web-new:3000/api/worker || echo "worker call failed";
        sleep 60;
        done

  # Nightly database backup to R2 at 03:17 UTC, and every Sunday after it a check that the newest backup is there,
  # recent and whole (web/scripts/backup-cron.ts). The image is web/Dockerfile.backup: Node 22 and pg_dump 17.
  # It joins the Supabase project's network (sb-morningtelos) and reaches Postgres as db:5432 through
  # BACKUP_DATABASE_URL. It gets only the backup keys, and the web app never gets them (web/tests/deploy.test.ts).
  # The private key that reads backups is never on this server: the full restore test runs in GitHub Actions
  # (.github/workflows/restore-test.yml). To run one now and read the log:
  #   docker compose -f deploy/web-compose.yml run --rm backup node scripts/backup.ts
  #   docker compose -f deploy/web-compose.yml run --rm backup node scripts/restore.ts check
  backup:
    image: ghcr.io/dev-perceptric/morningtelos-backup:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    networks: [sb-morningtelos]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      BACKUP_PUBLIC_KEY: ${BACKUP_PUBLIC_KEY:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}

# The self-hosted Supabase runs as its own Docker project (sb-morningtelos). Only the backup service joins its network.
networks:
  sb-morningtelos:
    external: true
