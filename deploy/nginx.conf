# Main site: morningtelos.com and www.morningtelos.com
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
}

# App: chat.morningtelos.com serves the app at "/".
# Images and styles come from the same files as the main site.
# Every other path (like /book/) goes to the main site.
server {
    listen 80;
    server_name chat.morningtelos.com;
    root /usr/share/nginx/html;

    location = / {
        try_files /demo/app/index.html =404;
    }
    location ~ ^/(img|assets)/ {
        try_files $uri =404;
    }
    location / {
        return 302 https://morningtelos.com$request_uri;
    }
}
