# Main site: morningtelos.com and www.morningtelos.com
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects use the path only, so they keep https and the host that Traefik passes in.
    absolute_redirect off;

    # Pages, CSS and JS keep the same names when they change, so browsers must check for a newer copy every time.
    # The check is cheap: the server answers "not changed" when the file is the same.
    location / {
        add_header Cache-Control "no-cache" always;
    }
    # The old agency service pages are gone. Send their visitors (and search engines) to the page that does that job now.
    location = /services/ai-lead-generation/ { return 301 /ai-employees/ai-sales-rep/; }
    location = /services/crm-sales-automation/ { return 301 /ai-employees/ai-sales-rep/; }
    location = /services/custom-software/ { return 301 /ai-employees/ai-website-builder/; }
    location ^~ /services/ { return 301 /; }
    # Images change rarely. Browsers may keep them for a day.
    location ~* \.(webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
